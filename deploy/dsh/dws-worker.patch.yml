# dws worker patch: aimodel deepseek 模型层 + engram MCP（streamable-http）。
# launcher 级 --patch 逐条前置（dsh-cmdline 契约），本文件经 options.dsh_patches 注入。
# reasoningEfforts 必须是映射（off: 空、low: low…），列表形态报 NO_ADAPTER。
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: aimodel-tencent-ds
    model: deepseek-flash
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      aimodel-tencent-ds:
        displayName: aimodel-DeepSeek
        apiKeyEnv: AIMODEL_TENCENT_DS_API_KEY
        api: anthropic-messages
        baseURL: https://aimodel.hsjdata.com
        models:
          - id: deepseek-flash
            name: deepseek-flash
            contextWindow: 1000000
            input: [ text, image ]
            reasoningEfforts: &efforts-with-off
              off:
              low: low
              medium: medium
              high: high
- insert:
    - id: mcp-engram
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: engram
        transport: streamable-http
        url: !!js process.env.DWS_ENGRAM_URL || ''
        headers:
          X-Engram-User: !!js process.env.DWS_ENGRAM_USER || ''

<!doctype html>
<html lang="zh-CN" data-ark-theme="metropolis" data-ark-depth="minimal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PROJECT D.I.A.M.O.N.D. · Metropolis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #06151d;
      --panel: #102431;
      --panel-2: #1b2e3a;
      --control: #0c1d27;
      --control-deep: #051219;
      --line: #30434d;
      --line-strong: #465962;
      --text: #f2f6f5;
      --text-secondary: #c9d2d1;
      --muted: #8e9c9e;
      --accent: #4ed6c0;
      --accent-ink: #4ed6c0;
      --accent-text: #101416;
      --accent-soft: rgba(78,214,192,.1);
      --accent-border: rgba(78,214,192,.34);
      --accent-2: #56c596;
      --accent-2-ink: #56c596;
      --accent-2-soft: rgba(86,197,150,.09);
      --accent-2-border: rgba(86,197,150,.4);
      --accent-3: #f5bd4f;
      --accent-3-ink: #f5bd4f;
      --accent-3-soft: rgba(245,189,79,.09);
      --accent-3-border: rgba(245,189,79,.4);
      --normal: #56c596;
      --attention: #f5bd4f;
      --urgent: #e85332;
      --success: #56c596;
      --success-ink: #56c596;
      --success-soft: rgba(86,197,150,.12);
      --success-border: rgba(86,197,150,.42);
      --info: #4ed6c0;
      --info-ink: #4ed6c0;
      --info-soft: rgba(78,214,192,.12);
      --info-border: rgba(78,214,192,.42);
      --warning: #f5bd4f;
      --warning-ink: #f5bd4f;
      --warning-soft: rgba(245,189,79,.12);
      --warning-border: rgba(245,189,79,.38);
      --danger: #e85332;
      --danger-ink: #ff7659;
      --danger-soft: rgba(232,83,50,.12);
      --danger-border: rgba(232,83,50,.4);
      --lime: var(--accent);
      --cyan: var(--accent);
      --red: var(--danger);
      --amber: var(--warning);
      --purple: var(--accent);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 8% 0%, var(--accent-soft), transparent 28rem),
        radial-gradient(circle at 95% 12%, var(--accent-2-soft), transparent 25rem),
        radial-gradient(circle at 55% 100%, var(--accent-3-soft), transparent 32rem),
        var(--bg);
      color: var(--text);
      font: 14px/1.55 "Oxanium", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    }
    select { font: inherit; }
    .shell { width: min(1480px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 48px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .mark {
      width: 46px; height: 46px; display: grid; place-items: center; overflow: hidden;
      border: 1px solid var(--accent-border); border-radius: 14px; background: var(--accent);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 8px 24px var(--accent-soft);
    }
    .mark svg { width: 34px; height: 34px; display: block; }
    .mark .glyph { fill: var(--accent-text); }
    h1 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .service-state { display: flex; align-items: center; gap: 10px; color: var(--muted); }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .settings-link {
      width: 38px; height: 38px; display: grid; place-items: center;
      color: var(--text); text-decoration: none; font-size: 20px; line-height: 1;
      background: var(--control); border: 1px solid var(--line); border-radius: 11px;
    }
    .settings-link:hover, .settings-link:focus-visible { color: var(--lime); border-color: var(--cyan); outline: none; }
    .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 5px var(--danger-soft); }
    .pulse.live { background: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
    .metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
    .metric, .panel { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); }
    .metric { padding: 16px 18px; }
    .metric span { display: block; color: var(--muted); font-size: 12px; }
    .metric strong { display: block; margin-top: 4px; font-size: 25px; letter-spacing: -.04em; }
    .metric strong.brand { color: var(--accent-ink); }
    .metric strong.success { color: var(--success-ink); }
    .metric strong.info { color: var(--info-ink); }
    .metric strong.warning { color: var(--warning-ink); }
    .metric strong.danger { color: var(--danger-ink); }
    .workbench { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(280px, .7fr); gap: 14px; margin-bottom: 14px; }
    .panel { padding: 20px; min-width: 0; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .panel h2 { margin: 0; font-size: 14px; letter-spacing: .02em; }
    .hint { color: var(--muted); font-size: 12px; }
    .active-list, .queue-list, .recent-list { display: grid; gap: 10px; }
    .active-card {
      background: linear-gradient(90deg, var(--info-soft), transparent 28rem), var(--panel-2);
      border: 1px solid var(--line-strong); border-left: 3px solid var(--info); border-radius: 15px; padding: 18px;
    }
    .active-top, .run-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
    .person { font-size: 17px; font-weight: 700; }
    .request { color: var(--text-secondary); margin: 9px 0 16px; max-width: 78ch; white-space: pre-wrap; }
    .badge { display: inline-flex; align-items: center; min-height: 25px; padding: 2px 9px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--text-secondary); background: var(--control); font-size: 12px; white-space: nowrap; }
    .badge.brand { color: var(--accent-ink); border-color: var(--accent-border); background: var(--accent-soft); }
    .badge.success { color: var(--success-ink); border-color: var(--success-border); background: var(--success-soft); }
    .badge.info { color: var(--info-ink); border-color: var(--info-border); background: var(--info-soft); }
    .badge.warning { color: var(--warning-ink); border-color: var(--warning-border); background: var(--warning-soft); }
    .badge.danger { color: var(--danger-ink); border-color: var(--danger-border); background: var(--danger-soft); }
    .badge.muted { color: var(--muted); }
    .steps { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; }
    .step { min-width: 0; }
    .step-line { height: 4px; border-radius: 999px; background: var(--line); margin-bottom: 7px; }
    .step.done .step-line { background: var(--success); }
    .step.current .step-line { background: var(--info); box-shadow: 0 0 0 1px var(--info-border); }
    .step-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 10px; }
    .step.current .step-label { color: var(--text); }
    .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-size: 12px; margin-top: 14px; }
    .queue-item { padding: 13px 14px; border: 1px solid var(--line); border-left: 3px solid var(--warning); border-radius: 13px; background: linear-gradient(90deg, var(--warning-soft), transparent 16rem), var(--panel-2); }
    .queue-item strong { display: block; }
    .queue-item .request { margin: 6px 0 8px; }
    .empty { display: grid; place-items: center; min-height: 130px; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; text-align: center; padding: 20px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    select { color: var(--text); background: var(--control); border: 1px solid var(--line); border-radius: 10px; padding: 7px 30px 7px 10px; }
    .run {
      --tone: var(--line-strong); --tone-soft: transparent;
      border: 1px solid var(--line); border-left: 3px solid var(--tone); border-radius: 14px;
      background: linear-gradient(90deg, var(--tone-soft), transparent 24rem), var(--panel-2); overflow: hidden;
    }
    .run.tone-success { --tone: var(--success); --tone-soft: var(--success-soft); }
    .run.tone-info { --tone: var(--info); --tone-soft: var(--info-soft); }
    .run.tone-warning { --tone: var(--warning); --tone-soft: var(--warning-soft); }
    .run.tone-danger { --tone: var(--danger); --tone-soft: var(--danger-soft); }
    .run summary { list-style: none; cursor: pointer; padding: 15px 16px; }
    .run summary::-webkit-details-marker { display: none; }
    .run:hover { border-color: var(--line-strong); border-left-color: var(--tone); }
    .run-title { min-width: 0; }
    .run-title strong { margin-right: 10px; }
    .run-title p { margin: 5px 0 0; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .run-time { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .run-body { border-top: 1px solid var(--line); padding: 16px; display: grid; gap: 14px; color: var(--text-secondary); }
    .detail-block h3 { margin: 0 0 6px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
    .detail-block p { margin: 0; white-space: pre-wrap; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { max-width: 100%; overflow-wrap: anywhere; border: 1px solid var(--line); background: var(--control); border-radius: 8px; padding: 4px 8px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .code-change { border-left: 2px solid var(--cyan); padding-left: 12px; }
    footer { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; }
    @media (max-width: 900px) {
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .workbench { grid-template-columns: 1fr; }
      .steps { grid-template-columns: repeat(4, 1fr); }
      header { align-items: flex-start; flex-direction: column; }
    }
  </style>
  <link rel="icon" href="/diamond-favicon.svg?v=3" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css?v=1">
  <script src="/theme.js"></script>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" focusable="false">
            <path class="glyph" fill-rule="evenodd" d="M32 5 59 32 32 59 5 32 32 5Zm0 8L13 32l19 19 19-19-19-19Z"/>
            <path class="glyph" d="m32 24 8 8-8 8-8-8 8-8Z"/>
          </svg>
        </div>
        <div><div class="eyebrow">DIAMOND Network / Metropolis</div><h1>PROJECT D.I.A.M.O.N.D.</h1></div>
      </div>
      <div class="header-actions">
        <button id="newSessionBtn" class="icon-btn" type="button" aria-label="开启会话" title="开启会话">＋</button>
        <div class="bell-wrap">
          <button id="bellBtn" class="icon-btn" type="button" aria-label="通知" title="通知">🔔<span id="bellBadge" class="bell-badge" hidden></span></button>
          <div id="bellDropdown" class="bell-dropdown" hidden></div>
        </div>
        <div class="service-state"><span id="pulse" class="pulse"></span><span id="serviceText">正在连接本地代理…</span></div>
        <a class="settings-link" href="/settings" aria-label="打开 DIAMOND Settings" title="DIAMOND Settings">⚙</a>
      </div>
    </header>

    <section id="metrics" class="metrics"></section>

    <section id="verdictPanel" class="panel board-panel board-verdicts" hidden>
      <div class="panel-head"><h2><span class="dot dot-danger" aria-hidden="true"></span>等我裁决</h2><span class="hint">一句话作答，✓ 为同意</span></div>
      <div id="verdictRows" class="verdict-rows"></div>
    </section>

    <section class="panel board-panel">
      <div class="panel-head"><h2><span class="mini-spinner" aria-hidden="true"></span>在跑会话</h2><span id="runningCount" class="hint"></span></div>
      <div id="boardRuns" class="board-run-rows"></div>
    </section>

    <section class="panel board-panel">
      <div class="panel-head"><h2>任务</h2><span class="hint">点开看事实与触碰会话</span></div>
      <div class="board-cols">
        <div class="board-col"><div class="board-col-head" role="heading" aria-label="进行中">▶</div><div id="colOpen" class="board-cards"></div></div>
        <div class="board-col"><div class="board-col-head" role="heading" aria-label="等待">⏸</div><div id="colWait" class="board-cards"></div></div>
        <div class="board-col board-col-done"><div class="board-col-head" role="heading" aria-label="完成">✅</div><div id="colDone" class="board-cards"></div></div>
      </div>
      <details id="doneStrip" class="board-done-strip" hidden>
        <summary><span aria-hidden="true">✅</span><span id="doneStripCount" class="hint"></span></summary>
        <div id="doneStripCards" class="board-cards"></div>
      </details>
    </section>

    <section class="workbench">
      <article class="panel">
        <div class="panel-head"><h2>当前任务 · Operations</h2><span class="hint">真实阶段 · 不显示虚假百分比</span></div>
        <div id="active" class="active-list"></div>
      </article>
      <aside class="panel">
        <div class="panel-head"><h2>任务队列 · Operations</h2><span id="queueCount" class="hint"></span></div>
        <div id="queue" class="queue-list"></div>
      </aside>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div><h2>会话 · Channels</h2><span class="hint">点击展开代码、验证与告警</span></div>
        <div class="filters">
          <select id="contactFilter" aria-label="联系人筛选"><option value="">全部联系人</option></select>
          <select id="statusFilter" aria-label="状态筛选"><option value="">全部状态</option></select>
        </div>
      </div>
      <div id="recent" class="recent-list"></div>
    </section>
    <footer><span>DIAMOND Network · 仅监听 127.0.0.1 · 黑板每 2 秒 · 状态每 3 秒刷新</span><span id="updated"></span></footer>
  </main>

  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
  <aside id="boardDrawer" class="board-drawer" hidden aria-label="任务详情">
    <button id="drawerClose" class="icon-btn drawer-close" type="button" aria-label="关闭">✕</button>
    <div id="drawerGoal" class="drawer-goal"></div>
    <div id="drawerPeople" class="drawer-people"></div>
    <div id="drawerFacts" class="drawer-facts"></div>
  </aside>

  <div id="newSessionOverlay" class="modal-overlay" hidden>
    <div class="modal-card" role="dialog" aria-label="开启会话">
      <textarea id="newSessionText" rows="4" placeholder="要它做什么？"></textarea>
      <select id="newSessionContact" aria-label="联系人"></select>
      <div class="modal-actions">
        <span id="newSessionError" class="modal-error" hidden></span>
        <button id="newSessionCancel" class="ghost-btn" type="button">取消</button>
        <button id="newSessionSend" type="button">发送</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script>
    const PHASES = [
      ["stabilizing", "合并消息"], ["screening", "规则检查"], ["routing", "前置节点"],
      ["acknowledged", "已确认"], ["worker", "执行节点"], ["steering", "补充已 Steer"],
      ["verifying", "代码核验"], ["freshness", "发送前复查"], ["sending", "发送"]
    ];
    const STATUS = {
      sent: ["已回复", "success"], shadow: ["影子回复", "info"], no_reply: ["无需回复", "muted"],
      silent: ["已处理未回复", "muted"],
      human_cooldown: ["人工接管", "warning"], refused: ["安全拒绝", "danger"], error: ["处理失败", "danger"],
      stale_supplement: ["补充后重算", "info"],
      invalid_reply: ["回复重算", "info"]
    };
    let snapshot = null;
    let recentRenderKey = "";
    const openRuns = new Set();

    const node = (tag, cls, text) => {
      const value = document.createElement(tag);
      if (cls) value.className = cls;
      if (text !== undefined && text !== null) value.textContent = String(text);
      return value;
    };
    const unitLabel = value => String(value || "").replace(/\bAgent\b/gi, "diamond-unit");
    const clear = value => { while (value.firstChild) value.removeChild(value.firstChild); };
    const time = value => value ? new Intl.DateTimeFormat("zh-CN", {hour:"2-digit", minute:"2-digit", second:"2-digit"}).format(new Date(value)) : "-";
    const duration = (start, end = Date.now()) => {
      const seconds = Math.max(0, Math.floor((new Date(end).getTime() - new Date(start).getTime()) / 1000));
      if (seconds < 60) return `${seconds}s`;
      return `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
    };
    const statusBadge = status => {
      const [label, cls] = STATUS[status] || [status || "未知", "muted"];
      return node("span", `badge ${cls}`, label);
    };
    const statusTone = status => (STATUS[status] || ["", "muted"])[1];
    const modelLane = (sessionId, workflow = snapshot?.workflow) => {
      if (!sessionId?.startsWith("dm-")) return "";
      const stage = (workflow?.stages || []).find(item => {
        const slug = String(item.agent || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
        return slug && sessionId.includes(`-${slug}-`);
      });
      if (stage) return unitLabel(stage.label || stage.agent);
      if (sessionId.includes("-luna-sol-")) return "Luna → Sol";
      if (sessionId.includes("-luna-")) return "Luna";
      if (sessionId.includes("-sol-")) return "Sol";
      return "Codex（旧）";
    };

    function renderMetrics(data) {
      const box = document.getElementById("metrics"); clear(box);
      [["正在执行", data.summary.active, "info"], ["等待队列", data.summary.queued, "warning"],
       ["今日回复", data.summary.sentToday, "success"],
       ["今日失败", data.summary.errorsToday, "danger"]].forEach(([label, value, cls]) => {
        const card = node("div", "metric"); card.append(node("span", "", label), node("strong", cls || "", value)); box.append(card);
      });
    }

    function renderActive(items) {
      const box = document.getElementById("active"); clear(box);
      if (!items.length) { box.append(node("div", "empty", "当前没有正在执行的私聊任务")); return; }
      items.forEach(item => {
        const card = node("article", "active-card");
        const top = node("div", "active-top");
        const identity = node("div"); identity.append(node("div", "person", item.contactName), node("div", "hint", item.contactAlias || ""));
        top.append(identity, node("span", "badge info", item.phaseLabel || "处理中")); card.append(top);
        if (item.requestPreview) card.append(node("p", "request", item.requestPreview));
        const steps = node("div", "steps");
        const current = Math.max(0, PHASES.findIndex(([key]) => key === item.phase));
        PHASES.forEach(([key, label], index) => {
          const step = node("div", `step ${index < current ? "done" : index === current ? "current" : ""}`);
          step.append(node("div", "step-line"), node("div", "step-label", label)); steps.append(step);
        });
        card.append(steps);
        const meta = node("div", "meta");
        meta.append(node("span", "", `已运行 ${duration(item.startedAt)}`), node("span", "", `第 ${item.attempt || 1} 次处理`), node("span", "", `${item.batchSize || 1} 条消息`));
        if (item.sessionId) meta.append(node("span", "", `session ${item.sessionId.slice(-10)}`));
        card.append(meta); box.append(card);
      });
    }

    function renderQueue(items) {
      const box = document.getElementById("queue"); clear(box);
      document.getElementById("queueCount").textContent = `${items.length} 个会话`;
      if (!items.length) { box.append(node("div", "empty", "没有等待任务")); return; }
      items.forEach(item => {
        const row = node("div", "queue-item");
        row.append(node("strong", "", item.contactName), node("p", "request", item.requestPreview || "请求摘要未保存"), node("span", "hint", `等待 ${duration(item.receivedAt)} · ${item.batchSize} 条 · ${item.contentLength} 字`)); box.append(row);
      });
    }

    function addBlock(parent, title, values) {
      const list = (Array.isArray(values) ? values : [values]).filter(Boolean);
      if (!list.length) return;
      const block = node("section", "detail-block"); block.append(node("h3", "", title));
      list.forEach(value => block.append(node("p", "", value))); parent.append(block);
    }

    function renderRecent(force = false) {
      const box = document.getElementById("recent");
      const contact = document.getElementById("contactFilter").value;
      const status = document.getElementById("statusFilter").value;
      const items = (snapshot?.recent || []).filter(item => (!contact || item.contactName === contact) && (!status || item.status === status));
      const nextKey = JSON.stringify([contact, status, items]);
      if (!force && nextKey === recentRenderKey) return;
      recentRenderKey = nextKey;
      clear(box);
      if (!items.length) { box.append(node("div", "empty", "当前筛选下没有处理记录")); return; }
      items.forEach(item => {
        const details = node("details", `run tone-${statusTone(item.status)}`); const summary = node("summary"); const top = node("div", "run-top");
        const title = node("div", "run-title"); const line = node("div"); line.append(node("strong", "", item.contactName), statusBadge(item.status));
        const lane = modelLane(item.sessionId); if (lane) line.append(node("span", "badge brand", lane));
        title.append(line, node("p", "", item.requestPreview || "历史记录未保存请求摘要"));
        top.append(title, node("span", "run-time", `${time(item.finishedAt)} · ${duration(item.startedAt, item.finishedAt)}`)); summary.append(top); details.append(summary);
        const body = node("div", "run-body"); addBlock(body, "对方消息", item.requestPreview || "历史记录未保存请求摘要"); addBlock(body, "模型路径", lane); addBlock(body, "处理结果", item.handled); addBlock(body, "原因", item.reason);
        details.append(body); details.open = openRuns.has(item.sessionId);
        details.addEventListener("toggle", () => details.open ? openRuns.add(item.sessionId) : openRuns.delete(item.sessionId));
        box.append(details);
      });
    }

    function populateFilters(data) {
      const contact = document.getElementById("contactFilter"); const previousContact = contact.value;
      const names = [...new Set(data.recent.map(item => item.contactName))].sort(); clear(contact); contact.append(new Option("全部联系人", "")); names.forEach(name => contact.append(new Option(name, name))); contact.value = previousContact;
      const status = document.getElementById("statusFilter"); const previousStatus = status.value;
      const statuses = [...new Set(data.recent.map(item => item.status))]; clear(status); status.append(new Option("全部状态", "")); statuses.forEach(value => status.append(new Option((STATUS[value] || [value])[0], value))); status.value = previousStatus;
    }

    async function refresh() {
      try {
        const response = await fetch("/api/snapshot", {cache: "no-store"}); if (!response.ok) throw new Error(`HTTP ${response.status}`);
        snapshot = await response.json(); const heartbeat = snapshot.service.heartbeatAt ? Date.now() - new Date(snapshot.service.heartbeatAt).getTime() : Infinity;
        const healthy = snapshot.service.running && heartbeat < 15000; document.getElementById("pulse").classList.toggle("live", healthy);
        document.getElementById("serviceText").textContent = healthy ? `${String(snapshot.service.mode).toUpperCase()} · 代理运行中 · PID ${snapshot.service.pid}` : "状态可能已过期";
        renderMetrics(snapshot); renderActive(snapshot.active); renderQueue(snapshot.queue); populateFilters(snapshot); renderRecent();
        document.getElementById("updated").textContent = `更新于 ${time(snapshot.generatedAt)}`;
      } catch (error) {
        document.getElementById("pulse").classList.remove("live"); document.getElementById("serviceText").textContent = "无法读取本地代理";
      }
    }
    document.getElementById("contactFilter").addEventListener("change", () => renderRecent(true));
    document.getElementById("statusFilter").addEventListener("change", () => renderRecent(true));
    refresh(); setInterval(refresh, 3000); setInterval(() => snapshot && renderActive(snapshot.active), 1000);

    // ---- 黑板（§18）：投影 + 回写，icon-first，2s 轮询 ----
    let board = null;
    let boardContacts = {};
    let boardAliasesLoaded = false;
    let toastTimer = 0;

    const boardList = value => Array.isArray(value) ? value : [];
    const taskFacts = task => boardList(task.facts ?? task.recent_facts);
    const mmss = start => {
      const seconds = Math.max(0, Math.floor((Date.now() - new Date(start).getTime()) / 1000));
      return `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
    };
    const within24h = value => {
      const at = new Date(value).getTime();
      return Number.isFinite(at) && Date.now() - at < 86400000;
    };
    const contactName = id => boardContacts[id] || (id ? String(id) : "?");

    function reconcile(container, items, keyOf, makeRow, updateRow) {
      const keep = new Set(items.map(keyOf));
      [...container.children].forEach(el => { if (el.dataset.key && !keep.has(el.dataset.key)) el.remove(); });
      const byKey = new Map([...container.children].filter(el => el.dataset.key).map(el => [el.dataset.key, el]));
      let anchor = null;
      items.forEach(item => {
        const key = keyOf(item);
        let el = byKey.get(key);
        if (!el) { el = makeRow(item); el.dataset.key = key; }
        if (updateRow) updateRow(el, item);
        const expected = anchor ? anchor.nextSibling : container.firstChild;
        if (el !== expected) container.insertBefore(el, expected);
        anchor = el;
      });
    }

    async function postBoard(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }

    function showToast(message, danger = false) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.toggle("danger", danger);
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.hidden = true; }, 4000);
    }

    async function loadBoardContacts() {
      try {
        const response = await fetch("/api/config", {cache: "no-store"});
        if (!response.ok) return;
        const data = await response.json();
        boardContacts = {};
        (data.contacts || []).forEach(contact => {
          ["user_id", "open_dingtalk_id", "alias", "display_name"].forEach(key => {
            if (contact[key]) boardContacts[contact[key]] = contact.display_name || contact.alias;
          });
        });
      } catch (error) { boardContacts = {}; }
    }

    const avatar = (id, cls) => {
      const el = node("span", `avatar ${cls || ""}`);
      const name = contactName(id);
      el.textContent = Array.from(name.trim())[0] || "?";
      el.title = name;
      return el;
    };

    // 通知铃：红点=等你，红字=失败，同任务聚一行。
    function renderBell(data) {
      const waiting = boardList(data.waiting_operator);
      const failed = [];
      const seenFailed = new Set();
      [...boardList(data.runs), ...boardList(data.recent_done), ...boardList(data.recent_failed)].forEach(run => {
        if (run.status !== "failed" && run.outcome !== "failed") return;
        if (seenFailed.has(run.session_id)) return;
        seenFailed.add(run.session_id);
        if (within24h(run.ended_at || run.updated_at)) failed.push(run);
      });
      const badge = document.getElementById("bellBadge");
      badge.textContent = String(waiting.length + failed.length);
      badge.hidden = waiting.length + failed.length === 0;
      const dropdown = document.getElementById("bellDropdown");
      if (dropdown.hidden) return;
      clear(dropdown);
      if (!waiting.length && !failed.length) {
        dropdown.append(node("div", "bell-empty", "没有需要你注意的事"));
        return;
      }
      const rows = new Map();
      waiting.forEach(task => rows.set(task.id ?? task.task_id ?? task.goal, {task, mine: true}));
      failed.forEach(run => {
        const key = run.task_id || `run-${run.session_id}`;
        if (rows.has(key)) return;
        rows.set(key, {run, mine: false});
      });
      rows.forEach(({task, run, mine}) => {
        const row = node("button", "bell-row");
        row.type = "button";
        row.append(avatar((task || run).contact_id, ""));
        const text = node("span", mine ? "bell-mine" : "bell-fail", (task || run).goal || (task || run).headline || "");
        if (mine) row.prepend(node("span", "dot dot-danger"));
        row.append(text);
        row.addEventListener("click", () => {
          dropdown.hidden = true;
          if (mine) document.getElementById("verdictPanel")?.scrollIntoView({behavior: "smooth"});
          else if ((task || run).id) openDrawer(board?.tasks?.find(item => item.id === (task || run).id) || task || run);
        });
        dropdown.append(row);
      });
    }

    // 等我裁决：红条 + 头像 + 一句话 + 行内作答。
    function renderVerdicts(data) {
      const items = boardList(data.waiting_operator);
      const panel = document.getElementById("verdictPanel");
      panel.hidden = !items.length;
      if (!items.length) return;
      const rows = document.getElementById("verdictRows");

      const send = (task, answer, input, button) => {
        button.disabled = true;
        postBoard("/api/task/answer", {task_id: task.id, answer})
          .then(() => { if (input) input.value = ""; boardRefresh(); })
          .catch(error => { showToast(error.message, true); button.disabled = false; });
      };

      reconcile(rows, items, task => task.id, task => {
        const row = node("article", "verdict-row");
        row.append(avatar(task.contact_id, ""));
        const goal = node("span", "board-goal");
        const input = document.createElement("input");
        input.className = "board-input";
        input.type = "text";
        input.placeholder = "一句话作答";
        const ok = node("button", "icon-btn ok-btn");
        ok.type = "button"; ok.textContent = "✓"; ok.title = "同意"; ok.setAttribute("aria-label", "同意");
        ok.addEventListener("click", () => send(task, "同意", input, ok));
        const sendBtn = node("button", "icon-btn send-btn");
        sendBtn.type = "button"; sendBtn.textContent = "➤"; sendBtn.title = "作答"; sendBtn.setAttribute("aria-label", "作答");
        sendBtn.addEventListener("click", () => {
          const answer = input.value.trim();
          if (!answer) return;
          send(task, answer, input, sendBtn);
        });
        input.addEventListener("keydown", event => {
          if (event.key === "Enter" && input.value.trim()) send(task, input.value.trim(), input, sendBtn);
        });
        row.append(goal, input, ok, sendBtn);
        row._goal = goal; row._avatar = row.firstChild;
        return row;
      }, (row, task) => {
        row._goal.textContent = task.goal || "";
        row._goal.title = task.goal || "";
        row._avatar.title = contactName(task.contact_id);
      });
    }

    // 在跑会话：头像 + spinner + 模型写的 headline + mm:ss + 最近 3 条进度小圆点 + 💬 介入。
    function renderRunning(data) {
      const runs = boardList(data.runs)
        .filter(run => run.status === "running" || run.status === "waiting")
        .sort((a, b) => String(a.started_at).localeCompare(String(b.started_at)));
      document.getElementById("runningCount").textContent = runs.length ? `${runs.length}` : "";
      const box = document.getElementById("boardRuns");

      const steer = (run, input, box2, button) => {
        button.disabled = true;
        postBoard(`/api/run/${encodeURIComponent(run.session_id)}/steer`, {text: input.value.trim()})
          .then(() => { box2.hidden = true; boardRefresh(); })
          .catch(error => { showToast(error.message, true); button.disabled = false; });
      };

      reconcile(box, runs, run => run.session_id, run => {
        const row = node("article", "board-run-row");
        row.append(avatar(run.contact_id, ""));
        const main = node("div", "run-main");
        const line = node("div", "run-line");
        const spinner = node("span", "spinner");
        const headline = node("span", "run-headline");
        const elapsed = node("span", "elapsed run-elapsed");
        line.append(spinner, headline, elapsed);
        const dots = node("div", "pdots");
        const steerBox = node("div", "steer-box");
        steerBox.hidden = true;
        const input = document.createElement("input");
        input.className = "board-input";
        input.type = "text"; input.placeholder = "对它说";
        const sendBtn = node("button", "icon-btn send-btn");
        sendBtn.type = "button"; sendBtn.textContent = "➤"; sendBtn.title = "送出"; sendBtn.setAttribute("aria-label", "送出");
        sendBtn.addEventListener("click", () => { if (input.value.trim()) steer(run, input, steerBox, sendBtn); });
        input.addEventListener("keydown", event => {
          if (event.key === "Enter" && input.value.trim()) steer(run, input, steerBox, sendBtn);
        });
        steerBox.append(input, sendBtn);
        main.append(line, dots, steerBox);
        const chat = node("button", "icon-btn steer-btn");
        chat.type = "button"; chat.textContent = "💬"; chat.title = "介入"; chat.setAttribute("aria-label", "介入");
        chat.addEventListener("click", () => { steerBox.hidden = !steerBox.hidden; if (!steerBox.hidden) input.focus(); });
        row.append(main, chat);
        row._spinner = spinner; row._headline = headline; row._elapsed = elapsed; row._dots = dots; row._avatar = row.firstChild;
        return row;
      }, (row, run) => {
        row._spinner.classList.toggle("paused", run.status === "waiting");
        row.classList.toggle("waiting", run.status === "waiting");
        if (row._headline.textContent !== (run.headline || "")) row._headline.textContent = run.headline || "";
        row._headline.title = run.headline || "";
        row._elapsed.dataset.started = run.started_at || "";
        row._elapsed.textContent = run.started_at ? mmss(run.started_at) : "";
        row._avatar.title = contactName(run.contact_id);
        const entries = boardList(run.recent_progress ?? run.progress).slice(-3);
        clear(row._dots);
        entries.forEach((entry, index) => {
          const dot = node("span", `pdot ${index === entries.length - 1 ? "latest" : ""}`);
          dot.title = `${time(entry.created_at)} ${entry.text || ""}`;
          row._dots.append(dot);
        });
      });
      if (!runs.length && !box.querySelector(".empty")) box.append(node("div", "empty", "现在没有在跑的会话"));
      else if (runs.length) [...box.children].forEach(el => { if (!el.dataset.key) el.remove(); });
    }

    // 任务看板：▶ ⏸ ✅ 三列，卡片点开右侧抽屉（facts 时间线 + 触碰会话头像）。
    const taskColumn = task => {
      if (task.status === "open") return "open";
      if (task.status === "waiting") return "wait";
      return "done";
    };

    function makeCard(openWith) {
      return task => {
        const card = node("button", "board-card");
        card.type = "button";
        card.append(avatar(task.contact_id, ""));
        const goal = node("span", "board-goal");
        card.append(goal);
        card._goal = goal; card._avatar = card.firstChild;
        card.addEventListener("click", () => openWith(task));
        return card;
      };
    }

    const updateCard = (card, task, operatorIds) => {
      card._goal.textContent = task.goal || "";
      card._goal.title = task.goal || "";
      card._avatar.title = contactName(task.contact_id);
      card.classList.toggle("is-done", taskColumn(task) === "done");
      card.classList.toggle("is-cancelled", task.status === "cancelled");
      card.classList.toggle("is-mine", operatorIds.has(task.id));
    };

    function renderTasks(data) {
      const tasks = boardList(data.tasks);
      const operatorIds = new Set(boardList(data.waiting_operator).map(task => task.id));
      const columns = {open: [], wait: [], done: []};
      tasks.forEach(task => columns[taskColumn(task)].push(task));
      columns.done.sort((a, b) => (a.status === "cancelled") - (b.status === "cancelled")
        || String(b.updated_at || "").localeCompare(String(a.updated_at || "")));
      const openDrawerByTask = task => openDrawer(task);
      const maker = makeCard(openDrawerByTask);
      Object.entries(columns).forEach(([kind, items]) => {
        const box = document.getElementById(kind === "open" ? "colOpen" : kind === "wait" ? "colWait" : "colDone");
        reconcile(box, items, task => task.id, maker, (card, task) => updateCard(card, task, operatorIds));
        if (!items.length && !box.querySelector(".board-col-empty")) box.append(node("div", "board-col-empty", "—"));
        if (items.length) [...box.children].forEach(el => { if (!el.dataset.key) el.remove(); });
      });

      const strip = document.getElementById("doneStrip");
      const recentDone = boardList(data.recent_done).filter(task =>
        within24h(task.updated_at || task.last_evidence_at || task.ended_at || task.created_at));
      strip.hidden = !recentDone.length;
      if (recentDone.length) {
        document.getElementById("doneStripCount").textContent = `${recentDone.length}`;
        const cards = document.getElementById("doneStripCards");
        reconcile(cards, recentDone, task => task.id, maker, (card, task) => updateCard(card, task, operatorIds));
      }
    }

    function openDrawer(task) {
      if (!task) return;
      document.getElementById("drawerGoal").textContent = task.goal || "";
      const people = document.getElementById("drawerPeople");
      clear(people);
      [...new Set([task.contact_id, ...boardList(task.contact_ids)])].filter(Boolean).forEach(id => people.append(avatar(id, "")));
      const factsBox = document.getElementById("drawerFacts");
      clear(factsBox);
      taskFacts(task).forEach(fact => {
        const row = node("div", "fact-row");
        row.append(node("span", `fact-dot ${fact.source === "human" ? "human" : fact.source === "contact" ? "contact" : "agent"}`));
        const text = node("span", "fact-text", fact.text || "");
        row.append(text, node("span", "fact-time", time(fact.created_at)));
        factsBox.append(row);
      });
      if (!taskFacts(task).length) factsBox.append(node("div", "empty", "还没有留下事实"));
      document.getElementById("drawerBackdrop").hidden = false;
      document.getElementById("boardDrawer").hidden = false;
    }

    function closeDrawer() {
      document.getElementById("drawerBackdrop").hidden = true;
      document.getElementById("boardDrawer").hidden = true;
    }

    // ＝ 开新会话：文本 + 联系人（内部任务可空）。
    function openNewSession() {
      const overlay = document.getElementById("newSessionOverlay");
      overlay.hidden = false;
      document.getElementById("newSessionError").hidden = true;
      const select = document.getElementById("newSessionContact");
      if (!boardAliasesLoaded) {
        boardAliasesLoaded = true;
        clear(select);
        select.append(new Option("内部任务", ""));
        fetch("/api/config", {cache: "no-store"})
          .then(response => response.ok ? response.json() : {contacts: []})
          .then(data => {
            clear(select);
            select.append(new Option("内部任务", ""));
            (data.contacts || []).forEach(contact => select.append(new Option(contact.display_name || contact.alias, contact.alias)));
          })
          .catch(() => {});
      }
      document.getElementById("newSessionText").focus();
    }

    function closeNewSession() {
      document.getElementById("newSessionOverlay").hidden = true;
      document.getElementById("newSessionText").value = "";
    }

    function sendNewSession() {
      const text = document.getElementById("newSessionText").value.trim();
      const error = document.getElementById("newSessionError");
      if (!text) { error.textContent = "请输入内容"; error.hidden = false; return; }
      const button = document.getElementById("newSessionSend");
      button.disabled = true;
      postBoard("/api/session/new", {
        text,
        contact_alias: document.getElementById("newSessionContact").value || null
      })
        .then(data => {
          closeNewSession();
          showToast(`已开启 ${String(data.sessionId || "").slice(0, 8)}`);
          boardRefresh();
        })
        .catch(exc => { error.textContent = exc.message; error.hidden = false; })
        .finally(() => { button.disabled = false; });
    }

    function renderBoard() {
      if (!board) return;
      renderBell(board);
      renderVerdicts(board);
      renderRunning(board);
      renderTasks(board);
    }

    async function boardRefresh() {
      try {
        const response = await fetch("/api/board", {cache: "no-store"});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        board = await response.json();
        renderBoard();
      } catch (error) {
        // 轮询失败保持上一帧，铃铛与各区不动。
      }
    }

    document.getElementById("newSessionBtn").addEventListener("click", openNewSession);
    document.getElementById("newSessionCancel").addEventListener("click", closeNewSession);
    document.getElementById("newSessionSend").addEventListener("click", sendNewSession);
    document.getElementById("newSessionText").addEventListener("keydown", event => {
      if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) sendNewSession();
    });
    document.getElementById("bellBtn").addEventListener("click", () => {
      const dropdown = document.getElementById("bellDropdown");
      dropdown.hidden = !dropdown.hidden;
      if (!dropdown.hidden) renderBell(board || {});
    });
    document.addEventListener("click", event => {
      const wrap = document.querySelector(".bell-wrap");
      if (!document.getElementById("bellDropdown").hidden && wrap && !wrap.contains(event.target)) {
        document.getElementById("bellDropdown").hidden = true;
      }
    });
    document.getElementById("drawerClose").addEventListener("click", closeDrawer);
    document.getElementById("drawerBackdrop").addEventListener("click", closeDrawer);
    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;
      if (!document.getElementById("newSessionOverlay").hidden) closeNewSession();
      else if (!document.getElementById("boardDrawer").hidden) closeDrawer();
      else document.getElementById("bellDropdown").hidden = true;
    });
    setInterval(() => {
      document.querySelectorAll(".elapsed[data-started]").forEach(el => {
        if (el.dataset.started) el.textContent = mmss(el.dataset.started);
      });
    }, 1000);
    loadBoardContacts().then(boardRefresh);
    setInterval(boardRefresh, 2000);
  </script>
</body>
</html>
